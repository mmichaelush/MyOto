name: Refresh sampled older-model statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '25 4 18 * *'
permissions:
  contents: read
concurrency:
  group: cohort-observations
  cancel-in-progress: false
jobs:
  sample:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/refresh-cohorts.mjs --before-2017
      - uses: actions/upload-artifact@v4
        with:
          name: older-model-sample
          path: src/data/cohorts.json
