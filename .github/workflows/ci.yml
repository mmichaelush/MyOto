name: MyOto validation
on:
  pull_request:
  push:
    branches: [main, 'myoto-v2/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        id: e2e
        env:
          MYOTO_E2E_STATIC: '1'
      - uses: actions/upload-artifact@v4
        if: failure() && steps.e2e.outcome == 'failure'
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: myoto-preview
          path: dist
