name: Observe engine serial changes
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 8 * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: engine-observations
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        fleet: [heavy, private]
    env:
      FLEET: ${{ matrix.fleet }}
      SNAPSHOT_PASSPHRASE: ${{ secrets.ENGINE_SNAPSHOT_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture and compare monthly engine observations
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ -z "$SNAPSHOT_PASSPHRASE" ]]; then
            echo "::error::Configure the ENGINE_SNAPSHOT_PASSPHRASE repository secret to store encrypted observations."
            exit 1
          fi
          umask 077
          temporary=$(mktemp -d)
          trap 'rm -rf -- "$temporary"' EXIT
          if [[ "$FLEET" == private ]]; then
            extension=sqlite
            node scripts/capture-private-history.mjs "$temporary/current.$extension"
            month=$(node --input-type=module -e '
              import { DatabaseSync } from "node:sqlite";
              const db = new DatabaseSync(process.argv[1], {readOnly: true});
              console.log(db.prepare("SELECT month FROM capture").get().month);
              db.close();
            ' "$temporary/current.$extension")
          else
            extension=json
            node scripts/capture-engine-observations.mjs --full "$temporary/current.$extension"
            month=$(jq -er '.month' "$temporary/current.$extension")
          fi
          prefix="engine-observations-$FLEET-"
          artifact=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and (.name | test(\"^${prefix}[0-9]{4}-[0-9]{2}\$\"))) | select(.name < \"$prefix$month\") | [.name, .workflow_run.id] | @tsv" \
            | sort -r | sed -n '1p')
          if [[ -n "$artifact" ]]; then
            IFS=$'\t' read -r artifact_name run_id <<< "$artifact"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$temporary/prior"
            printf '%s\n' "$SNAPSHOT_PASSPHRASE" | gpg --quiet --batch --pinentry-mode loopback \
              --passphrase-fd 0 --output "$temporary/previous.$extension" --decrypt "$temporary/prior/snapshot.gpg"
            if [[ "$FLEET" == private ]]; then
              node scripts/compare-private-history.mjs "$temporary/previous.$extension" "$temporary/current.$extension" "$RUNNER_TEMP/engine-change-summary.json"
            else
              node scripts/diff-vehicle-observations.mjs --aggregate "$temporary/previous.$extension" "$temporary/current.$extension" "$RUNNER_TEMP/engine-change-summary.json"
            fi
            echo 'comparison=true' >> "$GITHUB_OUTPUT"
          fi
          printf '%s\n' "$SNAPSHOT_PASSPHRASE" | gpg --quiet --batch --pinentry-mode loopback \
            --passphrase-fd 0 --cipher-algo AES256 --symmetric --output "$RUNNER_TEMP/snapshot.gpg" "$temporary/current.$extension"
          echo "month=$month" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-observations-${{ matrix.fleet }}-${{ steps.capture.outputs.month }}
          path: ${{ runner.temp }}/snapshot.gpg
          retention-days: 80
      - uses: actions/upload-artifact@v4
        if: steps.capture.outputs.comparison == 'true'
        with:
          name: engine-change-summary-${{ matrix.fleet }}-${{ steps.capture.outputs.month }}
          path: ${{ runner.temp }}/engine-change-summary.json
          retention-days: 80

  propose-summary:
    needs: observe
    if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check for comparison artifacts
        id: summaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pattern='^engine-change-summary-(private|heavy)-[0-9]{4}-[0-9]{2}$'
          matches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and (.name | test(\"$pattern\"))) | .name")
          if [[ -n "$matches" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No comparable snapshot pair is available yet.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.summaries.outputs.available == 'true'
        with:
          pattern: engine-change-summary-*
          path: engine-summary-input
      - name: Propose aggregate results for publication
        if: steps.summaries.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          shopt -s nullglob
          inputs=(engine-summary-input/engine-change-summary-*)
          if (( ${#inputs[@]} == 0 )); then
            echo 'No comparable snapshot pair is available yet.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p src/data/engine-changes
          for folder in "${inputs[@]}"; do
            name="${folder##*/engine-change-summary-}"
            [[ "$name" =~ ^(private|heavy)-[0-9]{4}-[0-9]{2}$ ]] || exit 1
            file="$folder/engine-change-summary.json"
            node scripts/validate-engine-summary.mjs "$file" "src/data/engine-changes/$name.json"
          done
          git add -- src/data/engine-changes
          if git diff --cached --quiet; then
            echo 'No comparable snapshot pair is available yet.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/engine-observations-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update aggregate engine observations'
          git push origin "$branch"
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE_BRANCH...$branch?expand=1"
          printf 'Verified engine observations ready for review\n\n%s\n' "$compare" >> "$GITHUB_STEP_SUMMARY"
          if ! gh pr create --draft --base "$BASE_BRANCH" --head "$branch" \
            --title 'Update aggregate engine observations' \
            --body 'Aggregate comparison of official registry snapshots.'; then
            echo '::warning::Automatic pull request unavailable. The run summary links to the verified snapshot.'
          fi
