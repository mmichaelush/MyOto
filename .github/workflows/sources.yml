name: Audit public data sources
on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * 1'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-sources.mjs
